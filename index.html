<title>WHY GUITAR — Cek Status Gitar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090a0c;color:#f4f4f4;font-family:Arial,sans-serif}
body{padding:0 0 40px;}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,#35110f 0,#090a0c 55%);z-index:-1}
.wrap{max-width:720px;margin:auto;padding:70px 18px 40px}
.card{background:rgba(28,29,34,.94);border:1px solid #35363e;border-radius:26px;padding:38px 28px;box-shadow:0 10px 35px #0008}
.logo{display:block;width:min(100%,280px);height:280px;object-fit:contain;margin:0 auto 24px;border-radius:28px}
h1{text-align:center;font-size:42px;margin:8px 0 12px;font-weight:800}
.sub{text-align:center;color:#aeb1ba;font-size:20px;margin-bottom:34px}
.actions{display:grid;gap:18px}
.action{display:flex;align-items:center;justify-content:center;width:100%;min-height:78px;padding:18px 20px;border-radius:20px;background:#e12626;color:#fff;text-decoration:none;font-weight:800;font-size:23px;box-shadow:0 6px 18px #0005;position:relative;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.action:active{transform:scale(.99)}
.action.admin{background:#e12626}
footer{text-align:center;color:#888;margin-top:28px;font-size:13px}
@media(max-width:520px){
 .wrap{padding:40px 12px 30px}
 .card{padding:28px 16px}
 .logo{width:250px;height:250px}
 h1{font-size:34px}
 .sub{font-size:18px}
 .action{font-size:20px;min-height:72px}
}
</style>
